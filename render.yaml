services:
- type: web
  name: khoj
  runtime: node
  plan: free
  region: singapore
  buildCommand: npm install && npm run build
  startCommand: node index.js
  envVars:
  - key: NODE_ENV
    value: production
  - key: API_VERSION
    value: /v1
  - key: DB_STRING
    value: mongodb+srv://khojuser:khojpassword123@cluster0.rygshv0.mongodb.net/khoj?retryWrites=true&w=majority&appName=Cluster0
  - key: SECREATE
    value: demosecretkeyforcollegesubmission123
version: "1"
